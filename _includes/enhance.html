<script>
// Everything this single-document, left-TOC layout needs that Quarto can't
// express declaratively:
//   1. The reader panel — downloads, the tip jar, the GitHub badge and the
//      author line — pinned below the TOC, and repeated as a card under the
//      title on mobile, where the TOC is hidden.
//   2. A scrollspy that highlights the current section as you scroll/click
//      (Quarto's built-in highlight does not track scroll for a left TOC).
//   3. The live GitHub star count in that panel.
//   4. Cloudflare beacons for the things a static site otherwise can't see:
//      downloads, support clicks, and how far people actually read.
(function () {
  // External links shown in the reader panel. Edit these URLs as needed.
  var GITHUB_URL = 'https://github.com/Krever/fintech-engineering-handbook';
  var LINKEDIN_URL = 'https://www.linkedin.com/in/krever/';
  var X_URL = 'https://x.com/Krever01';
  var HOME_URL = 'https://w.pitula.me';
  // Audiobook. Each URL is optional: empty = that row is hidden, all empty =
  // the whole "Listen" group is hidden. The MP3 is free; the store editions
  // cost AUDIOBOOK_PRICE, which is shown on their rows.
  var AUDIOBOOK_PRICE = '$5';
  var AUDIOBOOK_MP3_URL = 'https://github.com/Krever/fintech-engineering-handbook/releases/download/audiobook-v1/ElevenLabs_fintech-eng_v2.mp3';
  var AUDIOBOOK_SPOTIFY_URL = '';
  var AUDIOBOOK_ELEVENREADER_URL = '';
  // Tip jar. Empty = every support CTA below stays hidden.
  var KOFI_URL = 'https://ko-fi.com/krever';

  // Star count is fetched live from the GitHub API on each visit, cached in
  // localStorage so a returning reader (and a reader hopping between sections)
  // doesn't re-hit it. Unauthenticated GitHub allows 60 requests/hour per IP,
  // which the cache keeps us far below.
  var GITHUB_API = 'https://api.github.com/repos/Krever/fintech-engineering-handbook';
  var STARS_CACHE_KEY = 'feh:stars';
  var STARS_TTL_MS = 6 * 60 * 60 * 1000; // 6h

  // Reading milestones. A pageview is not a read — someone who arrives from a
  // link aggregator, skims the title and leaves looks identical to someone who
  // works through a chapter. These record the moments that do mean something,
  // so any future "N readers" claim rests on a measurement instead of a guess.
  // See read/engaged.html for why there are two, and how the pre-launch period
  // gets backfilled.
  var READ_MILESTONES = [
    { page: 'read/engaged.html', seconds: 180, depth: 0.10 },
    { page: 'read/deep.html',    seconds: 600, depth: 0.25 }
  ];
  // Time only accrues while the tab is visible AND the reader has done
  // something in the last minute, so a page parked in a background window (or
  // an open laptop in an empty room) never reaches a milestone.
  var IDLE_AFTER_MS = 60 * 1000;

  // Bare monochrome marks — no boxes, no brand colours. They inherit
  // currentColor so they pick up hover states from whatever contains them, and
  // sit at the same optical weight as the Bootstrap icons on the buttons. Each
  // viewBox is tightened to its path's ink so all three read at the same size:
  // the stock LinkedIn box (448x512) letterboxes, rendering it visibly small.
  function mark(viewBox, d, modifier) {
    var cls = 'fx-mark' + (modifier ? ' ' + modifier : '');
    return '<svg class="' + cls + '" viewBox="' + viewBox + '" aria-hidden="true">' +
      '<path fill="currentColor" d="' + d + '"/></svg>';
  }
  var GH_MARK = mark('0 0 24 24', 'M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.51 11.51 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12');
  var LI_MARK = mark('0 0 448 448', 'M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z');
  // ElevenReader's half-sun mark, traced from the app icon at
  // elevenreader.io/apple-touch-icon.png (they publish no vector). It is wider
  // than tall, so it gets its own box size (see .fx-mark--wide).
  var ELEVEN_MARK = mark('0 3.5 24 17', 'M0.71 11.37L0.04 13.83L0.04 14.01L6.45 15.73L6.52 15.80L6.41 15.91L0.00 17.66L0.75 20.27L0.93 20.27L8.83 18.11L9.65 17.81L10.21 17.29L10.51 16.70L10.58 16.25L10.62 14.68L13.34 14.68L13.38 16.25L13.53 16.88L13.75 17.29L14.16 17.70L14.61 17.96L22.10 19.98L22.73 20.20L22.92 20.20L23.03 20.27L23.25 20.24L23.96 17.66L18.11 16.06L17.59 15.91L17.44 15.80L17.52 15.73L23.96 13.98L23.25 11.37L23.18 11.33L16.84 13.08L16.70 13.04L21.47 8.16L19.49 6.22L14.76 11.03L14.68 10.96L16.17 5.48L16.17 5.29L16.40 4.58L16.36 4.36L16.17 4.36L13.75 3.69L12.00 10.25L11.93 10.21L10.21 3.69L7.57 4.40L7.71 5.18L9.13 10.55L9.28 10.92L9.20 11.03L4.47 6.22L2.50 8.20L7.27 13.01L7.23 13.08L0.97 11.37Z', 'fx-mark--wide');
  var X_MARK = mark('0 0 24 24', 'M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932zm-1.291 19.491h2.039L6.486 3.24H4.298l13.312 17.404z');

  // ── The reader panel ──────────────────────────────────────────────────────
  // Two groups and a byline. Everything is the same button in two weights:
  // outline for "get the book", a soft teal fill for the ask. The GitHub link
  // is the one exception, and only because a star count wants the split-badge
  // shape the platform itself established.

  function getGroup() {
    return '' +
      '<div class="fx-group">' +
        '<span class="fx-group__label">Take it with you</span>' +
        '<div class="fx-row">' +
          '<a class="fx-btn" href="index.pdf"  download><i class="bi bi-file-earmark-arrow-down"></i>PDF</a>' +
          '<a class="fx-btn" href="index.epub" download><i class="bi bi-book"></i>EPUB</a>' +
        '</div>' +
      '</div>';
  }

  // One icon button per audiobook edition, all on one line, each with its
  // price beside the icon: "Free" for the MP3, the store price for the paid
  // editions. The reader sees the cost before they click; the name is in the
  // tooltip and the aria-label.
  function listenGroup() {
    var buttons =
      listenButton(AUDIOBOOK_MP3_URL, '<i class="bi bi-download"></i>', 'Download MP3', 'Free', 'dl/mp3.html', true) +
      listenButton(AUDIOBOOK_SPOTIFY_URL, '<i class="bi bi-spotify"></i>', 'Spotify', AUDIOBOOK_PRICE, 'go/listen-spotify.html', false) +
      listenButton(AUDIOBOOK_ELEVENREADER_URL, ELEVEN_MARK, 'ElevenReader', AUDIOBOOK_PRICE, 'go/listen-elevenreader.html', false);
    if (!buttons) return '';
    return '' +
      '<div class="fx-group">' +
        '<span class="fx-group__label">Listen</span>' +
        '<div class="fx-row">' + buttons + '</div>' +
      '</div>';
  }

  function listenButton(url, icon, name, price, beacon, free) {
    if (!url) return '';
    var open = free ? ' download' : ' target="_blank" rel="noopener"';
    var label = name + ' (' + (free ? 'free' : price) + ')';
    return '' +
      '<a class="fx-btn fx-listen" href="' + url + '"' + open + ' data-ping="' + beacon + '"' +
        ' title="' + label + '" aria-label="' + label + '">' +
        icon +
        '<span class="fx-price" aria-hidden="true">' + price + '</span>' +
      '</a>';
  }

  // Starring and tipping are the same ask at two prices, so they share a line:
  // the paid one takes the space it needs for a warm label, the free one sizes
  // to its count. `where` names the beacon page for this placement, so the
  // Cloudflare dashboard shows which copy of the panel actually drives tips.
  function supportGroup(where) {
    var coffee = KOFI_URL
      ? '<a class="fx-btn fx-btn--accent" href="' + KOFI_URL + '" target="_blank" rel="noopener" data-support="' + where + '">' +
          '<i class="bi bi-cup-hot"></i>Buy me a coffee</a>'
      : '';
    return '' +
      '<div class="fx-group">' +
        '<span class="fx-group__label">Support the book</span>' +
        '<div class="fx-row">' + coffee + githubBadge() + '</div>' +
      '</div>';
  }

  // No "GitHub" wordmark: sharing a line with the tip jar, the octocat plus a
  // star count says it unambiguously, and the words are better spent on the
  // ask. The count segment stays hidden until the API answers, so a
  // rate-limited reader gets a plain mark rather than an empty socket.
  function githubBadge() {
    return '' +
      '<a class="gh-badge" href="' + GITHUB_URL + '" target="_blank" rel="noopener" aria-label="Source on GitHub">' +
        '<span class="gh-badge__main">' + GH_MARK + '</span>' +
        '<span class="gh-badge__count" hidden>' +
          '<i class="bi bi-star-fill"></i><span class="gh-badge__num"></span>' +
        '</span>' +
      '</a>';
  }

  function authorLine() {
    return '' +
      '<div class="fx-author">' +
        '<a class="fx-author__name" href="' + HOME_URL + '" target="_blank" rel="noopener">Voytek Pitula</a>' +
        '<span class="fx-author__links">' +
          '<a href="' + LINKEDIN_URL + '" target="_blank" rel="noopener" aria-label="LinkedIn">' + LI_MARK + '</a>' +
          '<a href="' + X_URL + '" target="_blank" rel="noopener" aria-label="X">' + X_MARK + '</a>' +
        '</span>' +
      '</div>';
  }

  function panelMarkup(where) {
    return getGroup() + listenGroup() + supportGroup(where) + authorLine();
  }

  // Desktop/tablet (>=768px) gets the panel pinned below the left TOC. Below
  // that the TOC is hidden entirely, so the same panel is repeated as a card
  // right under the title — the first thing a phone reader sees, rather than
  // buried at the end of a very long article. CSS shows exactly one of the two.
  function injectPanel() {
    var sidebar = document.querySelector('#quarto-sidebar-toc-left');
    if (sidebar && !sidebar.querySelector('.sidebar-footer')) {
      var footer = document.createElement('div');
      footer.className = 'sidebar-footer reader-panel';
      footer.innerHTML = panelMarkup('sidebar');
      sidebar.appendChild(footer);
    }
    var title = document.querySelector('#title-block-header');
    if (title && !document.querySelector('.grab-card')) {
      var card = document.createElement('aside');
      card.className = 'grab-card reader-panel';
      card.setAttribute('aria-label', 'Get this handbook');
      card.innerHTML = panelMarkup('mobile');
      title.insertAdjacentElement('afterend', card);
    }
  }

  // ── The ask at the end of the document ────────────────────────────────────
  // Rarely reached, but reached by readers who got the whole value, which is
  // the only place the ask is really earned.
  function injectSupportCard() {
    if (!KOFI_URL) return;
    var body = document.querySelector('main#quarto-document-content') || document.querySelector('main');
    if (!body || body.querySelector('.support-card')) return;
    var card = document.createElement('aside');
    card.className = 'support-card';
    card.setAttribute('aria-label', 'Support this handbook');
    card.innerHTML = '' +
      '<h2 class="support-card__title">Found this useful?</h2>' +
      '<p class="support-card__copy">' +
        'This handbook is free, has no ads, and always will be. If it saved you a bad ' +
        'week, a coffee is a good way to say so!'
      '</p>' +
      '<a class="support-card__btn" href="' + KOFI_URL + '" target="_blank" rel="noopener" data-support="end">' +
        '<i class="bi bi-cup-hot-fill"></i>Buy me a coffee' +
      '</a>';
    body.appendChild(card);
  }

  // ── Star count ────────────────────────────────────────────────────────────

  // 460 -> "460", 1234 -> "1.2k", 12345 -> "12k". Keeps the badge narrow.
  function compact(n) {
    if (n < 1000) return String(n);
    if (n < 10000) return (Math.floor(n / 100) / 10).toFixed(1).replace(/\.0$/, '') + 'k';
    return Math.round(n / 1000) + 'k';
  }

  function renderStars(stars) {
    if (!(stars > 0)) return;
    document.querySelectorAll('.gh-badge').forEach(function (badge) {
      var count = badge.querySelector('.gh-badge__count');
      var num = badge.querySelector('.gh-badge__num');
      if (!count || !num) return;
      num.textContent = compact(stars);
      count.hidden = false;
      badge.setAttribute('aria-label', 'Source on GitHub — ' + stars + ' stars');
    });
  }

  // localStorage can throw outright (Safari private mode, storage disabled), so
  // every access is guarded — a reader with storage off still gets a live count,
  // just without the cache.
  function cachedStars() {
    try {
      var raw = localStorage.getItem(STARS_CACHE_KEY);
      if (!raw) return null;
      var c = JSON.parse(raw);
      return (Date.now() - c.at < STARS_TTL_MS) ? c.stars : null;
    } catch (e) { return null; }
  }

  function cacheStars(stars) {
    try {
      localStorage.setItem(STARS_CACHE_KEY, JSON.stringify({ stars: stars, at: Date.now() }));
    } catch (e) { /* not worth caring about */ }
  }

  function loadStars() {
    var hit = cachedStars();
    if (hit) { renderStars(hit); return; }
    fetch(GITHUB_API, { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || typeof d.stargazers_count !== 'number') return;
        cacheStars(d.stargazers_count);
        renderStars(d.stargazers_count);
      })
      .catch(function () { /* rate-limited or offline: badge stays countless */ });
  }

  // ── Scrollspy ─────────────────────────────────────────────────────────────

  function scrollspy() {
    const links = Array.from(document.querySelectorAll('#TOC .nav-link'));
    if (!links.length) return;
    const items = links.map(link => {
      const target = (link.getAttribute('data-scroll-target') || link.getAttribute('href') || '').replace(/^#/, '');
      const el = target ? document.getElementById(target) : null;
      return el ? { link, el } : null;
    }).filter(Boolean); // document order === TOC order
    if (!items.length) return;

    const OFFSET = 120;
    let activeLink = null;
    function update() {
      let current = items[0];
      for (const it of items) {
        if (it.el.getBoundingClientRect().top - OFFSET <= 0) current = it;
        else break;
      }
      if (current.link === activeLink) return;
      if (activeLink) activeLink.classList.remove('active');
      current.link.classList.add('active');
      activeLink = current.link;
    }
    document.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  // ── Beacons ───────────────────────────────────────────────────────────────

  // Records an event by loading a tiny hidden page in an iframe, which fires
  // the Cloudflare beacon and so registers a pageview at that path. It is the
  // only event mechanism Cloudflare Web Analytics gives a static site, and it
  // costs the reader nothing: no redirect, no blocking, no cookie.
  function ping(page) {
    var frame = document.createElement('iframe');
    frame.src = page;
    frame.setAttribute('aria-hidden', 'true');
    frame.style.cssText = 'position:absolute;width:0;height:0;border:0;left:-9999px;';
    document.body.appendChild(frame);
    setTimeout(function () { frame.remove(); }, 5000);
  }

  // Download counting without touching UX. The PDF/EPUB links remain plain
  // `download` anchors (instant save, no redirect), so we don't preventDefault;
  // the real download keeps the page alive, giving the beacon time to send.
  function trackDownloads() {
    document.addEventListener('click', function (e) {
      const a = e.target.closest('a[download]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (/index\.pdf$/.test(href)) ping('dl/pdf.html');
      else if (/index\.epub$/.test(href)) ping('dl/epub.html');
    }, { passive: true });
  }

  // The click opens Ko-fi normally; the beacon records that a reader took the
  // step, on the path belonging to the placement they took it from.
  function trackSupportClicks() {
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-support]');
      if (a) ping('go/kofi-' + a.dataset.support + '.html');
    }, { passive: true });
  }

  // Audiobook rows name their own beacon page, one per edition.
  function trackListenClicks() {
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-ping]');
      if (a) ping(a.dataset.ping);
    }, { passive: true });
  }

  function trackReading() {
    // Once per tab session per milestone: a reader who lingers is one reader,
    // not one per re-scroll.
    var pending = READ_MILESTONES.filter(function (m) {
      try { return !sessionStorage.getItem('feh:' + m.page); } catch (e) { return true; }
    });
    if (!pending.length) return;

    var activeSeconds = 0;
    var maxDepth = 0;
    var lastActivity = Date.now();

    function depth() {
      var scrollable = document.documentElement.scrollHeight - window.innerHeight;
      if (scrollable <= 0) return 1;   // whole document already on screen
      return Math.min(1, (window.scrollY || 0) / scrollable);
    }

    function noteActivity() { lastActivity = Date.now(); }
    ['scroll', 'mousemove', 'keydown', 'wheel', 'touchstart', 'click'].forEach(function (evt) {
      document.addEventListener(evt, noteActivity, { passive: true });
    });

    var timer = setInterval(function () {
      var awake = document.visibilityState === 'visible' &&
                  Date.now() - lastActivity < IDLE_AFTER_MS;
      if (awake) activeSeconds += 1;
      // Sampled here rather than on scroll, so a document short enough to need
      // no scrolling still counts as fully read.
      maxDepth = Math.max(maxDepth, depth());

      pending = pending.filter(function (m) {
        if (activeSeconds < m.seconds || maxDepth < m.depth) return true;
        ping(m.page);
        try { sessionStorage.setItem('feh:' + m.page, '1'); } catch (e) { /* fine */ }
        return false;
      });
      if (!pending.length) clearInterval(timer);
    }, 1000);
  }

  function init() {
    injectPanel(); injectSupportCard(); scrollspy();
    trackDownloads(); trackSupportClicks(); trackListenClicks(); trackReading(); loadStars();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
